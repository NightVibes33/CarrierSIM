name: CarrierSIM
options:
  bundleIdPrefix: com.nightvibes33
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  CarrierSIM:
    type: application
    platform: iOS
    sources:
      - path: ios-app
    dependencies:
      - framework: AirliftFFI.xcframework
        embed: false
    settings:
      base:
        PRODUCT_NAME: "CarrierSIM"
        PRODUCT_BUNDLE_IDENTIFIER: com.nightvibes33.carriersim
        INFOPLIST_FILE: ios-app/Info.plist
        OTHER_LDFLAGS: "-lc++"
        GENERATE_INFOPLIST_FILE: NO
