name: Build CarrierSIM IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ios-app/**"
      - "airlift-patch/**"
      - "scripts/**"
      - "project.yml"
      - "build-ios.sh"
      - ".github/workflows/build-ios-ipa.yml"

permissions:
  contents: read

concurrency:
  group: carriersim-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout CarrierSIM
        uses: actions/checkout@v4

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-core/target
          key: carriersim-rust-${{ runner.os }}-${{ hashFiles('airlift-patch/**', 'scripts/patch-airlift.py', 'build-ios.sh') }}
          restore-keys: |
            carriersim-rust-${{ runner.os }}-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build pinned AirliftFFI
        run: chmod +x build-ios.sh && ./build-ios.sh

      - name: Build unsigned iPhone app
        run: |
          set -euo pipefail
          xcodebuild \
            -project CarrierSIM.xcodeproj \
            -scheme CarrierSIM \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP=".build/DerivedData/Build/Products/Release-iphoneos/CarrierSIM.app"
          test -d "$APP"
          rm -rf Payload CarrierSIM-unsigned.ipa
          mkdir Payload
          ditto "$APP" Payload/CarrierSIM.app
          /usr/bin/zip -qry CarrierSIM-unsigned.ipa Payload
          unzip -l CarrierSIM-unsigned.ipa | grep "Payload/CarrierSIM.app/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" Payload/CarrierSIM.app/Info.plist
          file Payload/CarrierSIM.app/CarrierSIM

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CarrierSIM-unsigned-ipa
          path: CarrierSIM-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
